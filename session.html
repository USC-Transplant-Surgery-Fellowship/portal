<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Fellowship sign-in</title>
</head>
<body>
  <p style="font:15px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:520px;margin:48px auto;padding:0 16px">
    This page keeps you signed in across the fellowship sites. There is nothing to see here:
    <a href="./">open the portal</a>.
  </p>
  <script>
  /*
   * One sign-in for the fellowship sites. Each site's api.js opens this page in a hidden frame and sends messages:
   *   { type: 'get', id }          → { id, token }   The saved token, or '' if none or expired.
   *   { type: 'set', id, token }   → { id, ok }      Saves a token after a sign-in.
   *   { type: 'clear', id }        → { id, ok }      Forgets the token, after Sign out or a refusal.
   * Only the SITES below may send messages.
   * It saves only these sites' tokens: Google's for the sites' client (an hour) or the sites' own code tokens (days).
   * The server checks every token on every request. This page only stores it in this browser until it expires.
   */
  (function () {
    var SITES = ['https://timeoff.usctransplant.life', 'https://schedule.usctransplant.life', 'https://portal.usctransplant.life'];
    var CLIENT_ID = '72967386715-cgntqve43vc2ptpkhprgalf714vtke38.apps.googleusercontent.com'; // as in api.js
    var KEY = 'fellowship.idToken';

    function payload(t) {
      try {
        var p = String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        while (p.length % 4) p += '=';
        return JSON.parse(decodeURIComponent(escape(atob(p))));
      } catch (e) { return null; }
    }
    function good(t) {
      var p = t && payload(t);
      var google = p && p.aud === CLIENT_ID && /^(https:\/\/)?accounts\.google\.com$/.test(p.iss);
      var ours = p && p.aud === 'fellowship-sites' && p.iss === 'usctransplant.life'; // as AUTH in auth.gs
      return !!((google || ours) && p.exp * 1000 > Date.now() + 60000);
    }
    function read() {
      try {
        var t = localStorage.getItem(KEY) || '';
        if (t && !good(t)) { localStorage.removeItem(KEY); t = ''; }
        return t;
      } catch (e) { return ''; }
    }
    function write(t) {
      try { if (t) localStorage.setItem(KEY, t); else localStorage.removeItem(KEY); return true; } catch (e) { return false; }
    }

    window.addEventListener('message', function (e) {
      if (SITES.indexOf(e.origin) === -1 || !e.source || !e.data || typeof e.data !== 'object') return;
      var m = e.data, reply = { id: m.id };
      if (m.type === 'get') reply.token = read();
      else if (m.type === 'set') reply.ok = good(m.token) && write(m.token);
      else if (m.type === 'clear') reply.ok = write('');
      else return;
      e.source.postMessage(reply, e.origin);
    });
    // Tells the parent page to start asking. The message holds nothing secret, so any parent may receive it.
    if (window.parent !== window) window.parent.postMessage({ type: 'hub-ready' }, '*');
  })();
  </script>
</body>
</html>
