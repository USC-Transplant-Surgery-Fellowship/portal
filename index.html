<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fellowship Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23990000'/%3E%3Crect x='5' y='7' width='22' height='13' rx='3' fill='%23c3ce9c'/%3E%3Cpath d='M8 11h2v2H8zm3 0h2v2h-2zm3 0h2v2h-2zm-6 4h2v2H8zm3 0h2v2h-2z' fill='%23232c17'/%3E%3Crect x='9' y='24' width='14' height='3' rx='1.5' fill='%23ffcc00'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#990000">
  <link rel="preload" href="assets/fonts/doto.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/portal.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="assets/ui.js"></script>
  <script src="assets/api.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="lcd">
        <div class="eyebrow">USC Transplant Surgery Fellowship</div>
        <h1>Portal</h1>
      </div>
      <div class="who" id="who"></div>
    </div>
  </header>

  <div id="auth"><section class="card"><div class="loading">Loading…</div></section></div>
  <main id="app" class="split portal" hidden>
    <div class="col side">
      <section class="card" id="sitesCard">
        <h2>Your sites</h2>
        <ul class="sites" id="sites"></ul>
      </section>

      <section class="card" id="findCard">
        <h2>Find someone</h2>
        <label class="label" for="search">Name, email or phone</label>
        <input id="search" type="text" autocomplete="off" placeholder="e.g. Russell">
        <div class="keys filters" role="radiogroup" aria-label="Show" id="filters"></div>
      </section>

      <section class="card" id="sharingCard" hidden>
        <h2>Calendar sharing</h2>
        <p class="hint">Share view-only Google calendars with fellows.</p>
        <ul class="sharing" id="sharing"></ul>
        <div class="toolbar one">
          <button class="secondary" id="checkSharing" type="button">Check calendar sharing</button>
        </div>
        <div class="status" id="sharingStatus" role="status" aria-live="polite"></div>
      </section>

      <section class="card" id="logCard" hidden>
        <h2>Recent changes</h2>
        <ul class="log" id="log" tabindex="0" aria-label="Recent changes"></ul>
      </section>
    </div>

    <div class="col wide">
      <section class="card" id="peopleCard">
        <div class="people-title">
          <h2 id="peopleTitle">Members</h2>
          <button class="secondary small" id="addBtn" type="button" hidden>Add a person</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="signups" id="signups" hidden></div>
        <div id="addForm"></div>
        <div id="people"><div class="loading">Loading…</div></div>
      </section>
    </div>
  </main>

  <script>
  (function () {
    var $ = UI.$, el = UI.el, clear = UI.clear, button = UI.button, plural = UI.plural, showStatus = UI.showStatus;
    var state = { view: null, who: null, filter: 'all', q: '', editing: '', draft: null, busy: false };
    var FILTERS = [['all', 'Everyone'], ['fellows', 'Fellows'], ['attendings', 'Attendings'], ['admins', 'Admins'], ['attention', 'Needs attention', true]];
    var MAX_PHONES = 5;

    /* ── server calls (one at a time) ── */
    function call(fn, args, onOk, box) {
      if (state.busy) return;
      state.busy = true; UI.busy(true);
      TimeOffApi.run(fn, args, function (res) { state.busy = false; UI.busy(false); onOk(res); }, function (err) {
        state.busy = false; UI.busy(false);
        if (err.code !== 'auth') showStatus(box || $('status'), 'error', 'Something went wrong', [err.message], true);
      });
    }
    function load() { call('apiPortalGet', [], function (v) { state.view = v; render(); }); }

    /* ── who's who ── */
    function appLabel(key) { return (state.view.apps.filter(function (a) { return a.key === key; })[0] || { label: key }).label; }
    function roleLabel(key) { return (state.view.roles.filter(function (r) { return r.key === key; })[0] || { label: key }).label; }
    function isFellow(u) { return Object.keys(u.roles).some(function (k) { return u.roles[k].indexOf('fellow') !== -1; }); }
    function isAdmin(u) { return u.superAdmin || Object.keys(u.roles).some(function (k) { return u.roles[k].indexOf('admin') !== -1; }); }
    function needsAttention(u) { return u.missing.length > 0; }
    /** Each site on its own line: "Time off: Fellow, Admin". */
    function rolesBox(u) {
      var box = el('div', 'person-roles');
      if (u.superAdmin) { box.appendChild(document.createTextNode('Super admin: can do everything on every site' + (isFellow(u) ? ' (also a fellow)' : '') + '.')); return box; }
      state.view.apps.forEach(function (a) {
        var r = u.roles[a.key] || [];
        if (!r.length) return;
        var line = el('div', 'role-line');
        line.appendChild(el('b', null, a.label + ':'));
        line.appendChild(document.createTextNode(' ' + r.map(roleLabel).join(', ')));
        box.appendChild(line);
      });
      return box;
    }
    /** "Fellow, starts Aug 2027, graduating 2029": which academic years they count as a fellow in. */
    function fellowYears(u) {
      return 'Fellow' + (u.startYear ? ', starts Aug ' + u.startYear : '') + (u.gradYear ? ', graduating ' + u.gradYear : '');
    }
    /** "Elise (Ellie) Heidorn": alternate first names after the first name, alternate last names after the last. */
    function fullName(u) {
      if (!u.firstName && !u.lastName) return u.name;
      var alt = function (list) { return list && list.length ? ' (' + list.join(', ') + ')' : ''; };
      return (u.firstName + alt(u.altFirstNames) + ' ' + u.lastName + alt(u.altLastNames)).trim();
    }
    function matches(u, f, q) {
      if (f === 'fellows' && !isFellow(u)) return false;
      if (f === 'attendings' && !u.attending) return false;
      if (f === 'admins' && !isAdmin(u)) return false;
      if (f === 'attention' && !needsAttention(u)) return false;
      q = String(q || '').trim().toLowerCase();
      if (!q) return true;
      var digits = q.replace(/\D/g, '');
      return [u.name, u.email, u.altEmail, u.jobTitle, u.gradYear].concat(u.altFirstNames || [], u.altLastNames || []).some(function (x) { return String(x || '').toLowerCase().indexOf(q) !== -1; }) ||
        (digits.length >= 3 && u.phones.some(function (p) { return p.replace(/\D/g, '').indexOf(digits) !== -1; }));
    }

    /* ── drawing ── */
    function render() {
      var v = state.view, admin = v.me.canEdit;
      $('addBtn').hidden = !admin;
      $('sharingCard').hidden = !admin;
      $('logCard').hidden = !admin;
      if (admin) { renderSharing(); UI.fillLog($('log'), v.log); }
      renderSignups();
      renderFilters();
      renderAddForm();
      renderPeople();
    }

    function renderSites(who) {
      var ul = $('sites'); clear(ul);
      (who.apps || []).filter(function (a) { return a.key !== 'portal'; }).forEach(function (a) {
        var li = el('li');
        var main = el('a', 'site-link', a.label); main.href = a.url;
        li.appendChild(main);
        if (a.adminUrl) { var ad = el('a', 'site-admin', 'Admin'); ad.href = a.adminUrl; li.appendChild(ad); }
        ul.appendChild(li);
      });
      if (!ul.firstChild) ul.appendChild(el('li', 'empty', 'You don’t have access to any of the sites yet.'));
    }

    function renderFilters() {
      var box = $('filters'); clear(box);
      var shown = FILTERS.filter(function (f) { return !f[2] || state.view.me.canEdit; });
      box.style.setProperty('--n', shown.length > 4 ? 2 : shown.length);
      shown.forEach(function (f) {
        var count = state.view.users.filter(function (u) { return matches(u, f[0], ''); }).length;
        var b = button('tab', f[1], function () { state.filter = f[0]; renderFilters(); renderPeople(); });
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', state.filter === f[0] ? 'true' : 'false');
        b.appendChild(el('small', null, String(count)));
        box.appendChild(b);
      });
    }

    /* The last check of the calendars' sharing (it runs after every change here, and with the button). */
    function renderSharing() {
      var sh = state.view.sharing, ul = $('sharing'); clear(ul);
      if (!sh) { ul.appendChild(el('li', 'empty', 'Not checked yet. Press “Check calendar sharing” to share the calendars with every fellow.')); return; }
      sh.calendars.forEach(function (c) {
        var li = el('li');
        li.appendChild(el('b', null, c.label));
        var ok = !c.error && !c.missing.length && !c.extra.length;
        li.appendChild(el('span', 'chip ' + (ok ? 'ok' : 'bad'), c.error ? 'Can’t check' : ok ? 'Up to date' : 'Needs a check'));
        var bits = [];
        if (c.error) bits.push(c.error);
        else {
          bits.push(c.shared + ' of ' + sh.wanted + ' fellows can see it.');
          if (c.missing.length) bits.push('Not yet shared with ' + c.missing.join(', ') + '.');
          if (c.extra.length) bits.push('Still shared with ex-fellows: ' + c.extra.join(', ') + '.');
        }
        li.appendChild(el('span', 'sharing-note', bits.join(' ')));
        ul.appendChild(li);
      });
      ul.appendChild(el('li', 'sharing-at', 'Checked ' + sh.at + '.'));
    }

    /* Sign-ups waiting for approval: approve by adding the person (the form starts filled in), or decline. */
    function renderSignups() {
      var v = state.view, box = $('signups'); clear(box);
      box.hidden = !(v.me.canEdit && v.signups.length);
      if (box.hidden) return;
      box.appendChild(el('h3', null, 'Waiting for approval (' + v.signups.length + ')'));
      var ul = el('ul', 'people');
      v.signups.forEach(function (s) {
        var li = el('li', 'person pending');
        var main = el('div', 'person-main');
        var name = el('div', 'person-name'); name.appendChild(el('b', null, s.firstName + ' ' + s.lastName));
        name.appendChild(el('span', 'chip muted', 'Signed up ' + s.at));
        main.appendChild(name);
        main.appendChild(el('div', 'person-sub', s.kind === 'fellow' ? fellowYears(s) : s.jobTitle));
        var contact = el('div', 'person-contact');
        var a = el('a', null, s.email); a.href = 'mailto:' + s.email; contact.appendChild(a);
        if (s.phone) { var t = el('a', null, s.phone); t.href = 'tel:' + s.phone.replace(/[^\d+]/g, ''); contact.appendChild(t); }
        main.appendChild(contact);
        if (s.note) main.appendChild(el('div', 'person-roles', '“' + s.note + '”'));
        li.appendChild(main);
        var actions = el('div', 'person-actions');
        actions.appendChild(button('secondary small strong', 'Approve…', function () { startAdd(s); }));
        actions.appendChild(UI.confirmButton('secondary small', 'Decline', 'Tap again to decline', function () {
          call('apiPortalChange', [{ type: 'decline', signupId: s.id }], afterChange);
        }));
        li.appendChild(actions);
        ul.appendChild(li);
      });
      box.appendChild(ul);
      box.appendChild(el('p', 'hint small', 'Approve opens “Add a person” filled in from the sign-up: choose their roles and save. New people sign up at portal.usctransplant.life/signup.html.'));
    }

    function renderPeople() {
      var v = state.view, box = $('people'); clear(box);
      var shown = v.users.filter(function (u) { return matches(u, state.filter, state.q); });
      $('peopleTitle').textContent = 'Members (' + v.users.length + ')';
      var sections = [
        ['Fellows', shown.filter(isFellow).sort(function (a, b) { return (a.gradYear || '9999') < (b.gradYear || '9999') ? -1 : (a.gradYear || '9999') > (b.gradYear || '9999') ? 1 : 0; })],
        ['Attendings', shown.filter(function (u) { return !isFellow(u) && u.attending; })],
        ['Everyone else', shown.filter(function (u) { return !isFellow(u) && !u.attending; })],
      ];
      sections.forEach(function (s) {
        if (!s[1].length) return;
        var sec = el('div', 'sec');
        sec.appendChild(el('h3', null, s[0] + ' (' + s[1].length + ')'));
        var ul = el('ul', 'people');
        s[1].forEach(function (u) { ul.appendChild(state.editing === u.id ? formItem(u) : personItem(u)); });
        sec.appendChild(ul);
        box.appendChild(sec);
      });
      if (!shown.length) box.appendChild(el('p', 'empty', state.q ? 'Nobody matches “' + state.q + '”.' : 'Nobody here.'));
    }

    function personItem(u) {
      var v = state.view, admin = v.me.canEdit;
      var li = el('li', 'person');
      var main = el('div', 'person-main');
      var name = el('div', 'person-name');
      name.appendChild(el('b', null, fullName(u)));
      if (u.id === v.me.id) name.appendChild(el('span', 'chip-you', 'You'));
      if (u.superAdmin) name.appendChild(el('span', 'chip ok', u.owner ? 'Fellowship account' : 'Super admin'));
      if (u.attending) name.appendChild(el('span', 'chip muted', 'Attending'));
      if (u.hpbFellow) name.appendChild(el('span', 'chip muted', 'HPB fellow'));
      main.appendChild(name);
      var sub = isFellow(u) ? fellowYears(u) : (u.jobTitle || '');
      if (sub) main.appendChild(el('div', 'person-sub', sub));
      var contact = el('div', 'person-contact');
      [u.email, u.altEmail].filter(Boolean).forEach(function (e) { var a = el('a', null, e); a.href = 'mailto:' + e; contact.appendChild(a); });
      u.phones.forEach(function (p) { var a = el('a', null, p); a.href = 'tel:' + p.replace(/[^\d+]/g, ''); contact.appendChild(a); });
      main.appendChild(contact);
      main.appendChild(rolesBox(u));
      if (admin && u.missing.length) main.appendChild(el('div', 'person-warn', 'Missing: ' + u.missing.join(', ') + '. Edit to fill it in.'));
      li.appendChild(main);
      if (!admin && u.id === v.me.id) {
        // Everyone can keep their own information up to date (not their roles).
        var mine = el('div', 'person-actions');
        mine.appendChild(button('secondary small', 'Edit my info', function () { startEdit(u); }));
        li.appendChild(mine);
      }
      if (admin) {
        var actions = el('div', 'person-actions');
        var lockedSuper = u.superAdmin && !v.me.superAdmin;
        if (!lockedSuper) actions.appendChild(button('secondary small', 'Edit', function () { startEdit(u); }));
        if (!u.owner && u.id !== v.me.id && !lockedSuper) {
          actions.appendChild(UI.confirmButton('secondary small', 'Remove', 'Tap again to remove', function () {
            call('apiPortalChange', [{ type: 'remove', id: u.id }], afterChange);
          }));
        }
        if (actions.firstChild) li.appendChild(actions);
      }
      return li;
    }

    /* ── adding and editing ── */
    function draftFor(u) {
      var roles = {};
      state.view.apps.forEach(function (a) { roles[a.key] = u ? (u.roles[a.key] || []).slice() : a.key === 'portal' ? ['viewer'] : []; });
      return {
        id: u ? u.id : '', owner: !!(u && u.owner), email: u ? u.email : '', altEmail: u ? u.altEmail : '',
        firstName: u ? u.firstName : '', lastName: u ? u.lastName : '',
        altFirstNames: u ? (u.altFirstNames || []).join(', ') : '', altLastNames: u ? (u.altLastNames || []).join(', ') : '',
        gradYear: u ? u.gradYear : '', startYear: u ? u.startYear || '' : '', jobTitle: u ? u.jobTitle : '', phones: u && u.phones.length ? u.phones.slice() : [''],
        attending: !!(u && u.attending), hpbFellow: !!(u && u.hpbFellow), superAdmin: !!(u && u.superAdmin), roles: roles,
      };
    }
    /** Opens "Add a person"; from a sign-up, filled in with its details and the usual roles for a fellow or a viewer. */
    function startAdd(signup) {
      state.adding = true; state.editing = ''; state.draft = draftFor(null);
      if (signup) {
        var d = state.draft, preset = presets().filter(function (p) { return p[0] === (signup.kind === 'fellow' ? 'Fellow' : 'Viewer everywhere'); })[0];
        d.email = signup.email; d.firstName = signup.firstName; d.lastName = signup.lastName;
        d.gradYear = signup.gradYear || ''; d.startYear = signup.startYear || ''; d.jobTitle = signup.jobTitle || ''; d.phones = signup.phone ? [signup.phone] : [''];
        if (preset) Object.keys(preset[1]).forEach(function (k) { d.roles[k] = preset[1][k].slice(); });
      }
      showStatus($('status'));
      renderAddForm(); renderPeople();
      var wrap = document.querySelector('#addForm'); if (wrap && wrap.scrollIntoView) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var f = document.querySelector('#addForm input'); if (f) f.focus();
    }
    function startEdit(u) {
      state.editing = u.id; state.draft = draftFor(u); state.adding = false;
      showStatus($('status'));
      renderAddForm(); renderPeople();
      var f = document.querySelector('.person-form input'); if (f) f.focus();
    }
    function stopEditing() { state.editing = ''; state.adding = false; state.draft = null; renderAddForm(); renderPeople(); }
    function renderAddForm() {
      var box = $('addForm'); clear(box);
      if (!state.adding) return;
      var wrap = el('div', 'add-wrap');
      wrap.appendChild(el('h3', null, 'Add a person'));
      wrap.appendChild(personForm());
      box.appendChild(wrap);
    }
    function formItem() { var li = el('li', 'person editing'); li.appendChild(personForm()); return li; }

    /** The role choices for one app: None (not in the portal, which everyone can see) and each role. */
    function roleChoices(app) {
      var roles = state.view.roles.filter(function (r) { return app.roles.indexOf(r.key) !== -1; });
      return (app.key === 'portal' ? [] : [{ key: '', label: 'None', with: [] }]).concat(roles);
    }
    /**
     * Tapping a role: roles that combine (Fellow and Admin) are switched on and off together; any other choice stands
     * alone. Switching off the last role leaves None (or Viewer in the portal).
     */
    function tapRole(app, current, role) {
      if (!role.key) return [];
      var combinable = current.every(function (k) { return k === role.key || role.with.indexOf(k) !== -1; });
      if (!role.with.length || !combinable) return [role.key];
      var next = current.indexOf(role.key) !== -1 ? current.filter(function (k) { return k !== role.key; }) : current.concat([role.key]);
      return next.length ? next : app.key === 'portal' ? ['viewer'] : [];
    }
    /** Quick settings for the usual kinds of people. */
    function presets() {
      var all = function (pick) { var r = {}; state.view.apps.forEach(function (a) { r[a.key] = pick(a); }); return r; };
      var has = function (a, k) { return a.roles.indexOf(k) !== -1; };
      return [
        ['Fellow', all(function (a) { return has(a, 'fellow') ? ['fellow'] : has(a, 'viewer') ? ['viewer'] : []; })],
        ['Viewer everywhere', all(function (a) { return has(a, 'viewer') ? ['viewer'] : []; })],
        ['Admin everywhere', all(function (a) { return has(a, 'admin') ? ['admin'] : []; })],
        ['No access', all(function (a) { return a.key === 'portal' ? ['viewer'] : []; })],
      ];
    }

    function field(label, key, opts) {
      opts = opts || {};
      var d = state.draft, wrap = el('label', 'pf-field' + (opts.wide ? ' wide' : ''));
      wrap.appendChild(el('span', 'label', label + (opts.optional ? '' : ' *')));
      var i = el('input'); i.type = opts.type || 'text'; i.value = d[key] || ''; i.autocomplete = 'off';
      if (opts.placeholder) i.placeholder = opts.placeholder;
      if (opts.inputmode) i.inputMode = opts.inputmode;
      if (opts.max) i.maxLength = opts.max;
      if (opts.disabled) i.disabled = true;
      i.addEventListener('input', function () { d[key] = i.value; });
      wrap.appendChild(i);
      if (opts.hint) wrap.appendChild(el('span', 'pf-hint', opts.hint));
      return wrap;
    }

    function personForm() {
      var v = state.view, d = state.draft, fellow = Object.keys(d.roles).some(function (k) { return d.roles[k].indexOf('fellow') !== -1; });
      var self = !v.me.canEdit; // editing their own information: no roles or ticks
      var form = el('div', 'person-form');
      var grid = el('div', 'pf-grid');
      grid.appendChild(field('First name', 'firstName', { max: 40 }));
      grid.appendChild(field('Last name', 'lastName', { max: 40, hint: d.attending ? 'Living donor case titles use the last name.' : '' }));
      grid.appendChild(field('Primary email', 'email', { type: 'email', placeholder: 'name@gmail.com', disabled: d.owner || self, wide: true,
        hint: d.owner ? 'The fellowship account’s email can’t be changed.' : self ? 'Ask an admin to change your primary email.' : '' }));
      grid.appendChild(field('Alternate email', 'altEmail', { type: 'email', optional: true, placeholder: 'e.g. name@med.usc.edu', wide: true, hint: 'Optional. Can also sign in.' }));
      form.appendChild(grid);
      if (!self) form.appendChild(rolesFieldset());
      // Fellows (in any site) have a graduating year, and a start year if they haven't started yet; everyone else a job title.
      // The years decide which academic years they count as a fellow in, so only admins change them.
      var more = el('div', 'pf-grid pf-more-fields');
      if (fellow) {
        more.appendChild(field('Graduating year', 'gradYear', { inputmode: 'numeric', max: 4, placeholder: 'e.g. 2027', disabled: self,
          hint: self ? 'Ask an admin to change your years.' : 'A fellow through July 31 of this year.' }));
        more.appendChild(field('Start year', 'startYear', { inputmode: 'numeric', max: 4, placeholder: 'e.g. 2027', optional: true, disabled: self,
          hint: 'Starts August 1 of this year. Leave blank if they’ve already started.' }));
      }
      else more.appendChild(field('Job title', 'jobTitle', { max: 80, placeholder: 'e.g. Transplant surgeon', wide: true }));
      form.appendChild(more);
      form.appendChild(altNames());

      // Phones
      var phones = el('div', 'pf-phones');
      phones.appendChild(el('span', 'label', 'Phone numbers'));
      d.phones.forEach(function (p, i) {
        var row = el('div', 'pf-phone');
        var input = el('input'); input.type = 'tel'; input.value = p; input.autocomplete = 'off'; input.placeholder = 'e.g. (323) 555-0123';
        input.setAttribute('aria-label', 'Phone number ' + (i + 1));
        input.addEventListener('input', function () { d.phones[i] = input.value; });
        row.appendChild(input);
        if (d.phones.length > 1) row.appendChild(button('secondary small', 'Remove', function () { d.phones.splice(i, 1); rerenderForm(); }));
        phones.appendChild(row);
      });
      if (d.phones.length < MAX_PHONES) phones.appendChild(button('linkbtn pf-more', '+ Another number', function () { d.phones.push(''); rerenderForm(); }));
      form.appendChild(phones);

      // Attending, HPB fellow, super admin (admins only)
      if (!self) {
        form.appendChild(checkRow('attending', 'Attending', ''));
        if (fellow || d.hpbFellow) form.appendChild(checkRow('hpbFellow', 'HPB fellow', 'Can be on a service with one other fellow.'));
        if (v.me.superAdmin && !d.owner) form.appendChild(checkRow('superAdmin', 'Super admin', 'Can do everything on every site, including making other super admins. Their roles above only matter for being a fellow.'));
        else if (d.superAdmin) form.appendChild(el('p', 'pf-hint', d.owner ? 'The fellowship account is always a super admin.' : 'Super admin (only a super admin can change this).'));
      }

      var actions = el('div', 'pf-actions');
      actions.appendChild(button('primary small', d.id ? 'Save changes' : 'Add ' + (d.firstName ? d.firstName : 'person'), save_));
      actions.appendChild(button('secondary small', 'Cancel', function () { stopEditing(); }));
      form.appendChild(actions);
      var st = el('div', 'status'); st.id = 'formStatus'; st.setAttribute('role', 'status'); st.setAttribute('aria-live', 'polite');
      form.appendChild(st);
      return form;
    }

    /** Alternate names: other first and last names used on the calendars (every combination counts as this person). */
    function altNames() {
      var d = state.draft, wrap = el('div', 'pf-alt');
      wrap.appendChild(el('span', 'label', 'Alternate name(s)'));
      var grid = el('div', 'pf-grid');
      [['altFirstNames', 'First name(s)', 'e.g. Ellie'], ['altLastNames', 'Last name(s)', 'e.g. Smith']].forEach(function (f) {
        var i = el('input'); i.type = 'text'; i.value = d[f[0]] || ''; i.autocomplete = 'off'; i.placeholder = f[2];
        i.setAttribute('aria-label', 'Alternate ' + f[1].toLowerCase());
        i.addEventListener('input', function () { d[f[0]] = i.value; });
        var box = el('label', 'pf-field'); box.appendChild(el('span', 'pf-sublabel', f[1])); box.appendChild(i);
        grid.appendChild(box);
      });
      wrap.appendChild(grid);
      wrap.appendChild(el('span', 'pf-hint', 'Optional. Separate several with commas.'));
      return wrap;
    }

    /** The roles in each site, with quick settings for the usual kinds of people. */
    function rolesFieldset() {
      var v = state.view, d = state.draft;
      var roles = el('fieldset', 'pf-roles');
      roles.appendChild(el('legend', null, 'What they can do'));
      var quick = el('div', 'pf-presets');
      quick.appendChild(el('span', 'pf-hint', 'Quick set:'));
      presets().forEach(function (p) {
        quick.appendChild(button('toggle', p[0], function () { Object.keys(p[1]).forEach(function (k) { d.roles[k] = p[1][k].slice(); }); rerenderForm(); }));
      });
      roles.appendChild(quick);
      v.apps.forEach(function (a) {
        var row = el('div', 'pf-app');
        row.appendChild(el('span', 'pf-app-name', a.label));
        var choices = roleChoices(a), now = d.roles[a.key] || [];
        var keys = el('div', 'keys rolekeys'); keys.style.setProperty('--n', choices.length);
        keys.setAttribute('role', 'group'); keys.setAttribute('aria-label', a.label + ' (Fellow and Admin can both be chosen)');
        choices.forEach(function (c) {
          var b = button('tab', c.label, function () { d.roles[a.key] = tapRole(a, now, c); rerenderForm(); });
          b.setAttribute('aria-pressed', (c.key ? now.indexOf(c.key) !== -1 : !now.length) ? 'true' : 'false');
          keys.appendChild(b);
        });
        row.appendChild(keys);
        roles.appendChild(row);
      });
      return roles;
    }
    function checkRow(key, title, text) {
      var d = state.draft, row = el('label', 'override-toggle pf-check');
      var box = el('input'); box.type = 'checkbox'; box.checked = !!d[key];
      box.addEventListener('change', function () { d[key] = box.checked; rerenderForm(); });
      var t = el('span'); t.appendChild(el('b', null, title));
      if (text) { t.appendChild(el('br')); t.appendChild(document.createTextNode(text)); }
      row.appendChild(box); row.appendChild(t);
      return row;
    }
    /** Re-draws the open form from the draft (after a choice that changes which fields show). */
    function rerenderForm() {
      var y = window.scrollY;
      if (state.adding) renderAddForm(); else renderPeople();
      window.scrollTo(0, y);
    }

    function save_() {
      var d = state.draft, fellow = Object.keys(d.roles).some(function (k) { return d.roles[k].indexOf('fellow') !== -1; });
      var user = {
        email: d.email, altEmail: d.altEmail, firstName: d.firstName, lastName: d.lastName,
        altFirstNames: d.altFirstNames, altLastNames: d.altLastNames, hpbFellow: d.hpbFellow,
        // Fellows have a graduating year (and maybe a start year); everyone else a job title.
        gradYear: fellow ? d.gradYear : '', startYear: fellow ? d.startYear : '', jobTitle: fellow ? '' : d.jobTitle,
        phones: d.phones.map(function (p) { return p.trim(); }).filter(Boolean),
        attending: d.attending, superAdmin: d.superAdmin, roles: d.roles,
      };
      call('apiPortalChange', [d.id ? { type: 'edit', id: d.id, user: user } : { type: 'add', user: user }], function (res) {
        if (!res.ok) { showStatus($('formStatus'), 'error', 'Not saved', res.errors, true); return; }
        afterChange(res);
      }, $('formStatus'));
    }
    function afterChange(res) {
      if (!res.ok) { showStatus($('status'), 'error', 'Not changed', res.errors, true); return; }
      state.view = res.view;
      state.editing = ''; state.adding = false; state.draft = null;
      render();
      showStatus($('status'), 'ok', 'Saved', res.lines, true);
    }

    /* ── wiring ── */
    $('search').addEventListener('input', function (e) { state.q = e.target.value; if (state.view) renderPeople(); });
    $('addBtn').addEventListener('click', function () {
      startAdd(null);
    });
    $('checkSharing').addEventListener('click', function () {
      call('apiPortalCheckSharing', [], function (res) {
        state.view = res.view; render();
        showStatus($('sharingStatus'), res.problems.length ? 'error' : 'ok', res.problems.length ? 'Some sharing couldn’t be changed' : 'Done', res.lines.concat(res.problems));
      }, $('sharingStatus'));
    });
    TimeOffApi.start({ app: 'portal', need: 'viewer', years: false, onReady: function (who) { state.who = who; renderSites(who); load(); } });
  })();
  </script>
</body>
</html>
